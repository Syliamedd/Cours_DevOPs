name: Afficher la branche

on:
  push:
    branches:
      - master
      - Dev
      - Val
      - Prod

jobs:
  afficher-branche:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher le nom de la branche
        env:
          BRANCHE: ${{ github.ref_name }}
        run: 'echo "Branche actuelle : $BRANCHE"'